<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>สินค้าทั้งหมด - iHAVEPHAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>

<body class="font-[Prompt] bg-gray-50 flex flex-col min-h-screen">

    <header class="sticky top-0 bg-white shadow-md z-50">
        <div class="max-w-7xl mx-auto flex items-center justify-between px-4 md:px-6 py-3">
            <a href="index.html" class="flex items-center space-x-2">
                <img src="iHavephai.png" onerror="this.src='https://via.placeholder.com/50x50?text=Logo'" class="w-12">
                <span class="font-bold text-green-600 text-xl hidden sm:block">iHAVEPHAI</span>
            </a>
            <nav class="hidden md:flex gap-8 text-gray-700 font-medium">
                <a href="index.html" class="hover:text-green-600 transition">หน้าแรก</a>
                <a href="products.html" class="text-green-600 font-bold">สินค้าทั้งหมด</a>
                <a href="crafts.html" class="hover:text-green-600 transition">งานไม้ไผ่</a>
                <a href="articles.html" class="hover:text-green-600 transition">บทความ</a>
            </nav>
            <button onclick="toggleCart()" class="relative text-gray-600 hover:text-green-600 transition">
                <i class="fa-solid fa-cart-shopping text-xl"></i>
                <span id="cart-badge" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center opacity-0">0</span>
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
        <div class="flex flex-col md:flex-row gap-8">
            
            <aside class="w-full md:w-1/4 space-y-6">
                <div class="bg-white p-5 rounded-xl shadow-sm border">
                    <h3 class="font-bold text-lg mb-4 text-gray-800"><i class="fa-solid fa-filter mr-2"></i>หมวดหมู่</h3>
                    <ul class="space-y-2">
                        <li><button onclick="filterCategory('all')" class="w-full text-left px-3 py-2 rounded hover:bg-green-50 text-gray-600 hover:text-green-700 transition category-btn active font-bold text-green-700 bg-green-50" data-cat="all">ทั้งหมด</button></li>
                        <li><button onclick="filterCategory('พันธุ์ไผ่')" class="w-full text-left px-3 py-2 rounded hover:bg-green-50 text-gray-600 hover:text-green-700 transition category-btn" data-cat="พันธุ์ไผ่">พันธุ์ไผ่</button></li>
                        <li><button onclick="filterCategory('เฟอร์นิเจอร์')" class="w-full text-left px-3 py-2 rounded hover:bg-green-50 text-gray-600 hover:text-green-700 transition category-btn" data-cat="เฟอร์นิเจอร์">เฟอร์นิเจอร์</button></li>
                        <li><button onclick="filterCategory('ของใช้')" class="w-full text-left px-3 py-2 rounded hover:bg-green-50 text-gray-600 hover:text-green-700 transition category-btn" data-cat="ของใช้">ของใช้</button></li>
                        <li><button onclick="filterCategory('อาหาร')" class="w-full text-left px-3 py-2 rounded hover:bg-green-50 text-gray-600 hover:text-green-700 transition category-btn" data-cat="อาหาร">อาหารแปรรูป</button></li>
                    </ul>
                </div>
            </aside>

            <div class="w-full md:w-3/4">
                <div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">
                    <h1 class="text-2xl font-bold text-gray-800">รายการสินค้า <span id="item-count" class="text-sm font-normal text-gray-500">(9 รายการ)</span></h1>
                    <div class="flex items-center gap-2">
                        <label class="text-sm text-gray-600">เรียงตาม:</label>
                        <select id="sort-select" onchange="sortProducts()" class="border border-gray-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
                            <option value="default">แนะนำ</option>
                            <option value="price-asc">ราคา: ต่ำ -> สูง</option>
                            <option value="price-desc">ราคา: สูง -> ต่ำ</option>
                            <option value="name-asc">ชื่อ: ก-ฮ</option>
                        </select>
                    </div>
                </div>

                <div id="product-grid" class="grid grid-cols-2 lg:grid-cols-3 gap-6">
                    </div>
            </div>
        </div>
    </main>

    <div id="cart-modal" class="fixed inset-0 z-[70] hidden">
        <div class="absolute inset-0 bg-black bg-opacity-60 transition-opacity" onclick="toggleCart()"></div>
        <div class="absolute right-0 top-0 h-full w-full max-w-md bg-white shadow-xl flex flex-col translate-x-full transition-transform duration-300" id="cart-panel">
            <div class="p-5 border-b flex justify-between items-center bg-gray-50">
                <h2 class="text-xl font-bold text-gray-800">ตะกร้าของฉัน</h2>
                <button onclick="toggleCart()" class="text-gray-500 hover:text-red-500"><i class="fa-solid fa-xmark text-2xl"></i></button>
            </div>
            <div id="cart-items" class="flex-1 overflow-y-auto p-5 space-y-4"></div>
            <div class="p-5 border-t bg-gray-50">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-gray-600">ยอดรวม</span>
                    <span class="text-2xl font-bold text-green-600">฿<span id="cart-total">0</span></span>
                </div>
                <button onclick="alert('ไปหน้าชำระเงินเรียบร้อย!')" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700 transition shadow-lg">สั่งซื้อสินค้า</button>
            </div>
        </div>
    </div>

    <script>
        // --- DATA (ฐานข้อมูลสินค้า - ควรเหมือนกันทุกหน้า) ---
        const allProducts = [
            { id: 1, name: "ไผ่กิมซุง (กิ่งพันธุ์)", price: 35, category: "พันธุ์ไผ่", image: "https://images.unsplash.com/photo-1533907650686-70576141c030?auto=format&fit=crop&w=500&q=80" },
            { id: 2, name: "เก้าอี้ไม้ไผ่สาน Handmade", price: 1290, category: "เฟอร์นิเจอร์", image: "https://images.unsplash.com/photo-1594273577741-6e3e55132d73?auto=format&fit=crop&w=500&q=80" },
            { id: 3, name: "หลอดดูดน้ำไม้ไผ่ (แพ็ค 10)", price: 150, category: "ของใช้", image: "https://images.unsplash.com/photo-1605342415177-3d964344183d?auto=format&fit=crop&w=500&q=80" },
            { id: 4, name: "โคมไฟไม้ไผ่สาน", price: 590, category: "ของใช้", image: "https://plus.unsplash.com/premium_photo-1664303387790-25e98547e231?auto=format&fit=crop&w=500&q=80" },
            { id: 5, name: "หน่อไม้หวานอัดถุง", price: 80, category: "อาหาร", image: "https://images.unsplash.com/photo-1615485925763-8678628890a6?auto=format&fit=crop&w=500&q=80" },
            { id: 6, name: "รั้วไม้ไผ่สำเร็จรูป (1.5ม.)", price: 450, category: "ของใช้", image: "https://images.unsplash.com/photo-1567332367554-18c7d812b322?auto=format&fit=crop&w=500&q=80" },
            { id: 7, name: "ตะกร้าสานไม้ไผ่", price: 250, category: "ของใช้", image: "https://images.unsplash.com/photo-1616606015525-4c0628290740?auto=format&fit=crop&w=500&q=80" },
            { id: 8, name: "ถ่านดูดกลิ่นไม้ไผ่", price: 45, category: "ของใช้", image: "https://images.unsplash.com/photo-1599908630737-1833878c772e?auto=format&fit=crop&w=500&q=80" },
            { id: 9, name: "โต๊ะกาแฟไม้ไผ่ Modern", price: 2500, category: "เฟอร์นิเจอร์", image: "https://images.unsplash.com/photo-1533090481720-856c6e3c1fdc?auto=format&fit=crop&w=500&q=80" }
        ];

        let currentCategory = 'all';
        let cart = JSON.parse(localStorage.getItem('iHavePhaiCart')) || [];

        // --- RENDER FUNCTION ---
        function render(products) {
            const grid = document.getElementById('product-grid');
            document.getElementById('item-count').innerText = `(${products.length} รายการ)`;
            
            grid.innerHTML = products.map(p => `
                <div class="bg-white rounded-xl shadow-sm hover:shadow-xl transition duration-300 border border-gray-100 overflow-hidden group flex flex-col h-full">
                    <div class="h-48 overflow-hidden relative cursor-pointer" onclick="goToDetail(${p.id})">
                        <img src="${p.image}" class="w-full h-full object-cover group-hover:scale-110 transition duration-500">
                        <span class="absolute top-2 left-2 bg-green-100 text-green-800 text-xs font-semibold px-2 py-1 rounded-md">${p.category}</span>
                    </div>
                    <div class="p-4 flex flex-col flex-1">
                        <h3 onclick="goToDetail(${p.id})" class="font-bold text-gray-800 text-lg hover:text-green-600 cursor-pointer line-clamp-2 mb-1">${p.name}</h3>
                        <div class="mt-auto flex justify-between items-center pt-3">
                            <span class="text-red-500 font-bold text-xl">฿${p.price.toLocaleString()}</span>
                            <button onclick="addToCart(${p.id})" class="bg-green-50 text-green-700 border border-green-200 hover:bg-green-600 hover:text-white hover:border-transparent px-3 py-2 rounded-lg transition flex items-center gap-2">
                                <i class="fa-solid fa-cart-plus"></i> <span class="text-sm font-bold">เพิ่ม</span>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // --- FILTER & SORT ---
        function filterCategory(cat) {
            currentCategory = cat;
            // Update UI buttons
            document.querySelectorAll('.category-btn').forEach(btn => {
                if(btn.dataset.cat === cat) {
                    btn.classList.add('bg-green-50', 'text-green-700', 'font-bold');
                    btn.classList.remove('text-gray-600');
                } else {
                    btn.classList.remove('bg-green-50', 'text-green-700', 'font-bold');
                    btn.classList.add('text-gray-600');
                }
            });
            sortProducts(); // Re-apply sort/filter
        }

        function sortProducts() {
            const sortValue = document.getElementById('sort-select').value;
            let filtered = currentCategory === 'all' ? [...allProducts] : allProducts.filter(p => p.category === currentCategory);

            if(sortValue === 'price-asc') filtered.sort((a,b) => a.price - b.price);
            else if(sortValue === 'price-desc') filtered.sort((a,b) => b.price - a.price);
            else if(sortValue === 'name-asc') filtered.sort((a,b) => a.name.localeCompare(b.name));

            render(filtered);
        }

        function goToDetail(id) {
            // ส่ง ID ไปยังหน้า Detail
            window.location.href = `product_detail.html?id=${id}`;
        }

        // --- CART SYSTEM (Copy Logic) ---
        function addToCart(id) {
            const product = allProducts.find(p => p.id === id);
            const existingItem = cart.find(item => item.id === id);
            if (existingItem) existingItem.qty++; else cart.push({ ...product, qty: 1 });
            saveCart();
            updateCartUI();
            
            // Animation Feedback
            const btn = event.currentTarget;
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-check"></i>';
            btn.classList.add('bg-green-600', 'text-white');
            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.classList.remove('bg-green-600', 'text-white');
            }, 1000);
        }

        function saveCart() { localStorage.setItem('iHavePhaiCart', JSON.stringify(cart)); }
        
        function toggleCart() {
            const modal = document.getElementById('cart-modal');
            const panel = document.getElementById('cart-panel');
            if(modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                setTimeout(() => panel.classList.remove('translate-x-full'), 10);
            } else {
                panel.classList.add('translate-x-full');
                setTimeout(() => modal.classList.add('hidden'), 300);
            }
        }

        function updateCartUI() {
            const badge = document.getElementById('cart-badge');
            const count = cart.reduce((sum, i) => sum + i.qty, 0);
            badge.innerText = count;
            badge.classList.toggle('opacity-0', count === 0);
            
            let total = 0;
            const html = cart.map(item => {
                total += item.price * item.qty;
                return `
                <div class="flex gap-3 mb-4 border-b pb-3">
                    <img src="${item.image}" class="w-16 h-16 object-cover rounded-md">
                    <div class="flex-1">
                        <h4 class="font-bold text-sm text-gray-800 line-clamp-1">${item.name}</h4>
                        <div class="flex justify-between items-end mt-1">
                            <span class="text-xs text-gray-500">จำนวน: ${item.qty}</span>
                            <span class="font-bold text-green-600">฿${(item.price * item.qty).toLocaleString()}</span>
                        </div>
                    </div>
                </div>`;
            }).join('');
            
            document.getElementById('cart-items').innerHTML = html || '<div class="flex flex-col items-center justify-center h-full text-gray-400"><i class="fa-solid fa-basket-shopping text-4xl mb-2"></i><p>ยังไม่มีสินค้าในตะกร้า</p></div>';
            document.getElementById('cart-total').innerText = total.toLocaleString();
        }

        // Init
        render(allProducts);
        updateCartUI();
    </script>
</body>
</html>
