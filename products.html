<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>สินค้าทั้งหมด - iHAVEPHAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @keyframes bounce-short {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .cart-bounce { animation: bounce-short 0.3s ease-in-out; }
    </style>
</head>

<body class="font-[Prompt] bg-gray-50 flex flex-col min-h-screen">

    <header class="sticky top-0 bg-white shadow-md z-50">
        <div class="max-w-7xl mx-auto flex items-center justify-between px-4 md:px-6 py-3">
            <div class="flex items-center gap-4">
                <a href="index.html" class="flex items-center space-x-2">
                    <img src="iHavephai.png" onerror="this.src='https://via.placeholder.com/50x50?text=Logo'" class="w-12">
                    <span class="font-bold text-green-600 text-xl hidden sm:block">iHAVEPHAI</span>
                </a>
            </div>
            
            <nav class="hidden md:flex gap-8 text-gray-700 font-medium">
                <a href="index.html" class="hover:text-green-600">หน้าแรก</a>
                <a href="products.html" class="text-green-600">สินค้าทั้งหมด</a>
                <a href="crafts.html" class="hover:text-green-600">งานไม้ไผ่</a>
                <a href="articles.html" class="hover:text-green-600">บทความ</a>
            </nav>

            <div class="flex items-center gap-4">
                <button onclick="toggleCart()" class="relative p-2 text-gray-700 hover:text-green-600 transition">
                    <i class="fa-solid fa-cart-shopping text-xl"></i>
                    <span id="cart-badge" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] rounded-full h-5 w-5 flex items-center justify-center opacity-0 transition-opacity">0</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
        <div class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <h2 class="text-2xl font-bold text-gray-800 border-l-4 border-green-500 pl-4">สินค้าทั้งหมด</h2>
            <div class="relative w-full md:w-64">
                <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="ค้นหาสินค้า..." class="w-full pl-10 pr-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400"></i>
            </div>
        </div>

        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            </div>
    </main>

    <div id="cart-modal" class="fixed inset-0 z-[100] hidden">
        <div class="absolute inset-0 bg-black/50" onclick="toggleCart()"></div>
        <div id="cart-panel" class="absolute right-0 top-0 h-full w-80 bg-white shadow-xl transform translate-x-full transition-transform duration-300 flex flex-col">
            <div class="p-4 border-b flex justify-between items-center bg-green-600 text-white">
                <h3 class="font-bold text-lg"><i class="fa-solid fa-cart-shopping mr-2"></i>ตะกร้าของคุณ</h3>
                <button onclick="toggleCart()" class="text-2xl">&times;</button>
            </div>
            <div id="cart-items" class="flex-1 overflow-y-auto p-4">
                </div>
            <div class="p-4 border-t bg-gray-50">
                <div class="flex justify-between mb-4 font-bold text-lg">
                    <span>ยอดรวม:</span>
                    <span class="text-green-600">฿<span id="cart-total">0</span></span>
                </div>
                <button onclick="goToCheckout()" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700 transition">
                    ไปหน้าชำระเงิน
                </button>
            </div>
        </div>
    </div>

    <script>
        // ข้อมูลสินค้า
        const products = [
            { id: 1, name: "ไผ่ซางหม่น (ต้นกล้า)", price: 150, image: "https://images.unsplash.com/photo-1599420186946-7b6fb4e297f0?q=80&w=800", description: "ไผ่เนื้อหนา แข็งแรง" },
            { id: 2, name: "ไผ่กิมซุง", price: 120, image: "https://images.unsplash.com/photo-1533038590840-1cde6e668a91?q=80&w=800", description: "หน่อดกตลอดปี" },
            { id: 3, name: "เก้าอี้ไม้ไผ่", price: 1200, image: "https://images.unsplash.com/photo-1592078615290-033ee584e267?q=80&w=800", description: "งานสานประณีต" },
            { id: 4, name: "ตะกร้าไม้ไผ่", price: 350, image: "https://images.unsplash.com/photo-1544961371-50381e1f37e4?q=80&w=800", description: "ใส่อาหารหรือของขวัญ" },
            { id: 5, name: "ไผ่เลี้ยง (ต้นกล้า)", price: 100, image: "https://images.unsplash.com/photo-1516706004513-4155b467ec6b?q=80&w=800", description: "ปลูกง่าย ทนทาน" },
            { id: 6, name: "กระบอกน้ำไม้ไผ่", price: 80, image: "https://images.unsplash.com/photo-1505330622279-bf7d7fc918f4?q=80&w=800", description: "เป็นมิตรต่อสิ่งแวดล้อม" }
        ];

        let cart = JSON.parse(localStorage.getItem('iHavePhaiCart')) || [];

        function renderProducts(items = products) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = items.map(p => `
                <div class="bg-white rounded-xl shadow-sm overflow-hidden hover:shadow-md transition">
                    <img src="${p.image}" class="w-full h-40 object-cover">
                    <div class="p-4">
                        <h3 class="font-bold text-gray-800">${p.name}</h3>
                        <p class="text-green-600 font-bold mt-2">฿${p.price}</p>
                        <button onclick="addToCart(${p.id})" class="w-full mt-3 bg-green-600 text-white py-2 rounded-lg text-sm hover:bg-green-700 transition">
                            <i class="fa-solid fa-plus mr-1"></i> เพิ่มลงตะกร้า
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const existing = cart.find(item => item.id === id);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            saveCart();
            toggleCart();
        }

        function saveCart() {
            localStorage.setItem('iHavePhaiCart', JSON.stringify(cart));
            updateCartUI();
        }

        function updateCartUI() {
            const badge = document.getElementById('cart-badge');
            const itemsDiv = document.getElementById('cart-items');
            const totalSpan = document.getElementById('cart-total');
            
            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            badge.innerText = totalQty;
            badge.classList.toggle('opacity-0', totalQty === 0);

            let total = 0;
            itemsDiv.innerHTML = cart.map(item => {
                total += item.price * item.qty;
                return `
                    <div class="flex justify-between items-center mb-4 border-b pb-2">
                        <div class="text-sm">
                            <p class="font-bold">${item.name}</p>
                            <p class="text-gray-500">฿${item.price} x ${item.qty}</p>
                        </div>
                        <button onclick="removeFromCart(${item.id})" class="text-red-500 text-xs font-bold">ลบ</button>
                    </div>`;
            }).join('') || '<p class="text-center text-gray-400 py-10">ตะกร้าว่างเปล่า</p>';
            
            totalSpan.innerText = total.toLocaleString();
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            saveCart();
        }

        function toggleCart() {
            const modal = document.getElementById('cart-modal');
            const panel = document.getElementById('cart-panel');
            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                setTimeout(() => panel.classList.remove('translate-x-full'), 10);
            } else {
                panel.classList.add('translate-x-full');
                setTimeout(() => modal.classList.add('hidden'), 300);
            }
        }

        function filterProducts() {
            const text = document.getElementById('searchInput').value.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(text));
            renderProducts(filtered);
        }

        function goToCheckout() {
            if (cart.length === 0) return alert("กรุณาเลือกสินค้าก่อนครับ!");
            window.location.href = 'cart.html';
        }

        window.onload = () => {
            renderProducts();
            updateCartUI();
        };
    </script>
</body>
</html>
