<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>งานไม้ไผ่ & เฟอร์นิเจอร์ - iHAVEPHAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="font-[Prompt] bg-stone-50 flex flex-col min-h-screen text-stone-800">

    <header class="sticky top-0 bg-white/95 backdrop-blur shadow-sm z-50 border-b border-stone-100">
        <div class="max-w-7xl mx-auto flex items-center justify-between px-4 py-3">
            <a href="index.html" class="flex items-center space-x-2">
                <img src="iHavephai.png" onerror="this.src='https://via.placeholder.com/50x50?text=Logo'" class="w-12">
                <span class="font-bold text-green-700 text-xl hidden sm:block">iHAVEPHAI</span>
            </a>
            <nav class="hidden md:flex gap-8 text-gray-600 font-medium">
                <a href="index.html" class="hover:text-green-700 transition">หน้าแรก</a>
                <a href="products.html" class="hover:text-green-700 transition">สินค้าทั้งหมด</a>
                <a href="crafts.html" class="text-green-700 font-bold border-b-2 border-green-700">งานไม้ไผ่</a>
                <a href="articles.html" class="hover:text-green-700 transition">บทความ</a>
            </nav>
            <button onclick="toggleCart()" class="relative text-stone-600 hover:text-green-700 transition">
                <i class="fa-solid fa-cart-shopping text-xl"></i>
                <span id="cart-badge" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center opacity-0">0</span>
            </button>
        </div>
    </header>

    <section class="relative h-[350px] flex items-center justify-center">
        <div class="absolute inset-0 z-0">
             <img src="https://images.unsplash.com/photo-1594273577741-6e3e55132d73?auto=format&fit=crop&w=1200&q=80" class="w-full h-full object-cover filter brightness-50">
        </div>
        <div class="relative z-10 text-center text-white px-4">
            <h1 class="text-4xl md:text-5xl font-bold mb-4 tracking-wide">CRAFT & BAMBOO</h1>
            <p class="text-lg md:text-xl text-stone-200 max-w-2xl mx-auto">ศิลปะจากธรรมชาติ สู่งานดีไซน์ที่ลงตัวกับทุกการใช้ชีวิต</p>
        </div>
    </section>

    <main class="max-w-7xl mx-auto px-4 py-16 flex-grow w-full">
        
        <div class="flex items-center justify-between mb-10">
            <div>
                <h2 class="text-3xl font-bold text-stone-800">คอลเลกชันงานฝีมือ</h2>
                <div class="h-1 w-20 bg-green-600 mt-2"></div>
            </div>
            <a href="products.html" class="text-stone-500 hover:text-green-700 text-sm font-semibold">ดูสินค้าทั้งหมด <i class="fa-solid fa-arrow-right ml-1"></i></a>
        </div>

        <div id="craft-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            </div>

    </main>

    <div id="cart-modal" class="fixed inset-0 z-[70] hidden">
        <div class="absolute inset-0 bg-black bg-opacity-60 transition-opacity" onclick="toggleCart()"></div>
        <div class="absolute right-0 top-0 h-full w-full max-w-md bg-white shadow-xl flex flex-col translate-x-full transition-transform duration-300" id="cart-panel">
            <div class="p-5 border-b flex justify-between items-center bg-gray-50">
                <h2 class="text-xl font-bold">ตะกร้าสินค้า</h2>
                <button onclick="toggleCart()" class="text-gray-500 hover:text-red-500"><i class="fa-solid fa-xmark text-2xl"></i></button>
            </div>
            <div id="cart-items" class="flex-1 overflow-y-auto p-5 space-y-4"></div>
            <div class="p-5 border-t">
                <div class="flex justify-between items-center mb-4 text-lg font-bold text-stone-800">
                    <span>รวมทั้งสิ้น</span>
                    <span>฿<span id="cart-total">0</span></span>
                </div>
                <button onclick="alert('Proceed to Checkout')" class="w-full bg-stone-800 text-white py-3 rounded-lg hover:bg-stone-900 transition">ชำระเงิน</button>
            </div>
        </div>
    </div>

    <script>
        // Data Set (Same as Products Page)
        const allProducts = [
            { id: 1, name: "ไผ่กิมซุง (กิ่งพันธุ์)", price: 35, category: "พันธุ์ไผ่", image: "https://images.unsplash.com/photo-1533907650686-70576141c030?auto=format&fit=crop&w=500&q=80" },
            { id: 2, name: "เก้าอี้ไม้ไผ่สาน Handmade", price: 1290, category: "เฟอร์นิเจอร์", image: "https://images.unsplash.com/photo-1594273577741-6e3e55132d73?auto=format&fit=crop&w=500&q=80", desc: "งานสานมือ 100% ดีไซน์โมเดิร์น แข็งแรง ทนทาน" },
            { id: 3, name: "หลอดดูดน้ำไม้ไผ่ (แพ็ค 10)", price: 150, category: "ของใช้", image: "https://images.unsplash.com/photo-1605342415177-3d964344183d?auto=format&fit=crop&w=500&q=80" },
            { id: 4, name: "โคมไฟไม้ไผ่สาน", price: 590, category: "ของใช้", image: "https://plus.unsplash.com/premium_photo-1664303387790-25e98547e231?auto=format&fit=crop&w=500&q=80", desc: "แสงไฟนวลตา สร้างบรรยากาศอบอุ่นให้กับห้องของคุณ" },
            { id: 6, name: "รั้วไม้ไผ่สำเร็จรูป (1.5ม.)", price: 450, category: "ของใช้", image: "https://images.unsplash.com/photo-1567332367554-18c7d812b322?auto=format&fit=crop&w=500&q=80", desc: "ตกแต่งสวนสวยสไตล์ Zen ติดตั้งง่าย" },
            { id: 7, name: "ตะกร้าสานไม้ไผ่", price: 250, category: "ของใช้", image: "https://images.unsplash.com/photo-1616606015525-4c0628290740?auto=format&fit=crop&w=500&q=80", desc: "ใส่ของได้จุใจ สานละเอียด ปราณีต" },
            { id: 9, name: "โต๊ะกาแฟไม้ไผ่ Modern", price: 2500, category: "เฟอร์นิเจอร์", image: "https://images.unsplash.com/photo-1533090481720-856c6e3c1fdc?auto=format&fit=crop&w=500&q=80", desc: "โต๊ะกลางสำหรับห้องรับแขก สไตล์มินิมอล" }
        ];

        let cart = JSON.parse(localStorage.getItem('iHavePhaiCart')) || [];

        function renderCrafts() {
            // Filter only Crafts/Furniture/Decor
            const crafts = allProducts.filter(p => p.category === 'เฟอร์นิเจอร์' || p.category === 'ของใช้' || p.category === 'ตกแต่ง');
            
            const grid = document.getElementById('craft-grid');
            grid.innerHTML = crafts.map(p => `
                <div class="group bg-white rounded-xl shadow-lg overflow-hidden hover:shadow-2xl transition duration-500 border border-stone-100 flex flex-col">
                    <div class="h-64 overflow-hidden relative cursor-pointer" onclick="window.location.href='product_detail.html?id=${p.id}'">
                        <img src="${p.image}" class="w-full h-full object-cover group-hover:scale-105 transition duration-700">
                        <div class="absolute inset-0 bg-black/20 group-hover:bg-transparent transition duration-500"></div>
                        <span class="absolute top-4 right-4 bg-white/90 backdrop-blur px-3 py-1 rounded-full text-xs font-bold text-stone-800 shadow-sm">${p.category}</span>
                    </div>
                    <div class="p-8 flex flex-col flex-1">
                        <h3 class="font-bold text-2xl text-stone-800 mb-2 cursor-pointer hover:text-green-700" onclick="window.location.href='product_detail.html?id=${p.id}'">${p.name}</h3>
                        <p class="text-stone-500 text-sm mb-6 flex-1">${p.desc || 'สินค้าคุณภาพ คัดสรรวัสดุเกรดเอ ผ่านกระบวนการผลิตที่ใส่ใจสิ่งแวดล้อม'}</p>
                        
                        <div class="flex items-center justify-between mt-auto pt-4 border-t border-stone-100">
                            <span class="text-3xl font-bold text-stone-800">฿${p.price.toLocaleString()}</span>
                            <button onclick="addToCart(${p.id})" class="bg-stone-800 text-white px-6 py-3 rounded-full font-medium hover:bg-green-700 transition shadow-lg flex items-center gap-2">
                                <i class="fa-solid fa-bag-shopping"></i> ใส่ตะกร้า
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // --- Cart Logic (Identical to products.html) ---
        function addToCart(id) {
            const product = allProducts.find(p => p.id === id);
            const existingItem = cart.find(item => item.id === id);
            if (existingItem) existingItem.qty++; else cart.push({ ...product, qty: 1 });
            saveCart();
            updateCartUI();
            toggleCart();
        }
        function saveCart() { localStorage.setItem('iHavePhaiCart', JSON.stringify(cart)); }
        function toggleCart() {
            const m = document.getElementById('cart-modal'), p = document.getElementById('cart-panel');
            if(m.classList.contains('hidden')) { m.classList.remove('hidden'); setTimeout(()=>p.classList.remove('translate-x-full'),10); }
            else { p.classList.add('translate-x-full'); setTimeout(()=>m.classList.add('hidden'),300); }
        }
        function updateCartUI() {
            const badge = document.getElementById('cart-badge');
            const count = cart.reduce((sum, i) => sum + i.qty, 0);
            badge.innerText = count;
            badge.classList.toggle('opacity-0', count === 0);
            
            let total = 0;
            const html = cart.map(item => {
                total += item.price * item.qty;
                return `
                <div class="flex gap-3 mb-4 border-b pb-3 border-stone-100">
                    <img src="${item.image}" class="w-16 h-16 object-cover rounded">
                    <div class="flex-1">
                        <div class="flex justify-between">
                            <h4 class="font-bold text-sm text-stone-800">${item.name}</h4>
                            <button onclick="removeItem(${item.id})" class="text-xs text-red-400 hover:text-red-600">ลบ</button>
                        </div>
                        <div class="flex justify-between items-end mt-1">
                            <span class="text-xs text-stone-500">x${item.qty}</span>
                            <span class="font-bold text-green-700">฿${(item.price * item.qty).toLocaleString()}</span>
                        </div>
                    </div>
                </div>`;
            }).join('');
            document.getElementById('cart-items').innerHTML = html || '<p class="text-center text-stone-400 mt-10">ตะกร้าว่างเปล่า</p>';
            document.getElementById('cart-total').innerText = total.toLocaleString();
        }
        function removeItem(id) {
            cart = cart.filter(i => i.id !== id);
            saveCart();
            updateCartUI();
        }

        renderCrafts();
        updateCartUI();
    </script>
</body>
</html>
