<!DOCTYPE html>
<html lang="th">
  <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bamboo Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

  <!-- ─────────────────── NAVBAR ─────────────────── -->
  <nav class="bg-white shadow fixed w-full top-0 left-0 z-50">
    <div class="mx-auto max-w-7xl px-4 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold text-green-600">Bamboo Store</h1>

      <ul class="hidden md:flex space-x-6 font-semibold text-gray-700">
        <li class="hover:text-green-600 cursor-pointer">หน้าแรก</li>
        <li class="hover:text-green-600 cursor-pointer">สินค้า</li>
        <li class="hover:text-green-600 cursor-pointer">หมวดหมู่</li>
        <li class="hover:text-green-600 cursor-pointer">ติดต่อ</li>
      </ul>
    </div>
  </nav>

  <main class="pt-20">

    <!-- ─────────────────── BANNER SLIDER ─────────────────── -->
    <section class="relative w-full overflow-hidden select-none">
      
      <!-- ปุ่มซ้าย -->
      <button id="prevBtn"
        class="absolute left-3 top-1/2 -translate-y-1/2 z-20 bg-white/70 hover:bg-white w-10 h-10 rounded-full shadow flex items-center justify-center">
        ◀
      </button>

      <!-- ปุ่มขวา -->
      <button id="nextBtn"
        class="absolute right-3 top-1/2 -translate-y-1/2 z-20 bg-white/70 hover:bg-white w-10 h-10 rounded-full shadow flex items-center justify-center">
        ▶
      </button>

      <!-- slider wrapper -->
      <div id="slider" class="flex transition-transform duration-500 ease-in-out cursor-grab">

        <img src="banner1.jpg" class="w-full h-[220px] md:h-[380px] object-cover flex-shrink-0" draggable="false">
        <img src="banner2.jpg" class="w-full h-[220px] md:h-[380px] object-cover flex-shrink-0" draggable="false">
        <img src="banner3.jpg" class="w-full h-[220px] md:h-[380px] object-cover flex-shrink-0" draggable="false">
        <!-- clone สำหรับวนลูป -->
        <img src="banner1.jpg" class="w-full h-[220px] md:h-[380px] object-cover flex-shrink-0" draggable="false">

      </div>

      <!-- dots -->
      <div class="absolute bottom-3 left-0 right-0 flex justify-center gap-2 z-20">
        <div class="dot w-3 h-3 bg-white/70 rounded-full"></div>
        <div class="dot w-3 h-3 bg-white/30 rounded-full"></div>
        <div class="dot w-3 h-3 bg-white/30 rounded-full"></div>
      </div>

    </section>



    <!-- ─────────────────── CATEGORY ─────────────────── -->
    <section class="px-6 mt-10">
      <h2 class="text-2xl font-bold text-green-700 mb-4">หมวดหมู่สินค้าไผ่</h2>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">

        <div class="bg-white p-4 rounded-xl shadow hover:shadow-lg transition">
          <p class="font-semibold text-gray-700">ของใช้ในบ้าน</p>
        </div>

        <div class="bg-white p-4 rounded-xl shadow hover:shadow-lg transition">
          <p class="font-semibold text-gray-700">อุปกรณ์ครัวไผ่</p>
        </div>

        <div class="bg-white p-4 rounded-xl shadow hover:shadow-lg transition">
          <p class="font-semibold text-gray-700">เฟอร์นิเจอร์ไม้ไผ่</p>
        </div>

        <div class="bg-white p-4 rounded-xl shadow hover:shadow-lg transition">
          <p class="font-semibold text-gray-700">งานจักสาน</p>
        </div>

      </div>
    </section>



    <!-- ─────────────────── FILTER ─────────────────── -->
    <section class="px-6 mt-10 flex justify-between items-center">
      <h2 class="text-xl font-bold text-green-700">รายการสินค้า</h2>

      <select id="sort" class="px-3 py-2 rounded-lg bg-white shadow border">
        <option value="popular">ซื้อมากที่สุด</option>
        <option value="price-high">ราคาสูง → ต่ำ</option>
        <option value="price-low">ราคาต่ำ → สูง</option>
        <option value="new">สินค้าใหม่</option>
      </select>
    </section>



    <!-- ─────────────────── PRODUCT GRID ─────────────────── -->
    <section class="px-6 mt-6 mb-20">

      <div class="grid grid-cols-2 md:grid-cols-4 gap-5">

        <div class="bg-white rounded-xl shadow hover:shadow-xl overflow-hidden transition">
          <img src="https://images.unsplash.com/photo-1606813907291-7c21a6ac5e3b"
            class="w-full h-40 object-cover">
          <div class="p-3">
            <p class="font-semibold">กระติ๊บข้าวไม้ไผ่</p>
            <p class="text-green-600 font-bold">฿159</p>
          </div>
        </div>

        <div class="bg-white rounded-xl shadow hover:shadow-xl overflow-hidden transition">
          <img src="https://images.unsplash.com/photo-1591533134988-593d258f52f9"
            class="w-full h-40 object-cover">
          <div class="p-3">
            <p class="font-semibold">ชั้นวางไม้ไผ่</p>
            <p class="text-green-600 font-bold">฿459</p>
          </div>
        </div>

        <div class="bg-white rounded-xl shadow hover:shadow-xl overflow-hidden transition">
          <img src="https://images.unsplash.com/photo-1522312346375-d1a52e2b99b3"
            class="w-full h-40 object-cover">
          <div class="p-3">
            <p class="font-semibold">ช้อน–ส้อมไม้ไผ่</p>
            <p class="text-green-600 font-bold">฿89</p>
          </div>
        </div>

        <div class="bg-white rounded-xl shadow hover:shadow-xl overflow-hidden transition">
          <img src="https://images.unsplash.com/photo-1606813907323-7b873e33e33a"
            class="w-full h-40 object-cover">
          <div class="p-3">
            <p class="font-semibold">ถาดไม้ไผ่</p>
            <p class="text-green-600 font-bold">฿199</p>
          </div>
        </div>

      </div>

    </section>

  </main>



  <!-- ─────────────────── SLIDER SCRIPT ─────────────────── -->
  <script>
    const slider = document.getElementById("slider");
    const slides = document.querySelectorAll("#slider img");
    const dots = document.querySelectorAll(".dot");

    let index = 0;
    let isDragging = false;
    let start = 0;
    let prev = 0;
    let current = 0;

    // ปิด drag รูปภาพ
    slides.forEach(i => i.addEventListener("dragstart", e => e.preventDefault()));

    function updateDots() {
      dots.forEach(d => d.classList.remove("bg-white/70"));
      dots.forEach(d => d.classList.add("bg-white/30"));
      dots[index % 3].classList.add("bg-white/70");
    }

    function show(i) {
      slider.style.transition = "0.5s";
      slider.style.transform = `translateX(-${i * 100}%)`;
      updateDots();
    }

    function next() {
      index++;
      show(index);
      if (index === slides.length - 1) {
        setTimeout(() => {
          slider.style.transition = "none";
          index = 0;
          show(index);
        }, 500);
      }
    }

    function prev() {
      if (index === 0) {
        slider.style.transition = "none";
        index = slides.length - 2;
        slider.style.transform = `translateX(-${index * 100}%)`;
      }
      setTimeout(() => {
        index--;
        show(index);
      }, 20);
    }

    document.getElementById("nextBtn").onclick = next;
    document.getElementById("prevBtn").onclick = prev;

    setInterval(next, 4000);

    // Drag/mouse
    slider.addEventListener("mousedown", e => {
      isDragging = true;
      start = e.clientX;
      prev = -index * slider.clientWidth;
      slider.style.transition = "none";
    });

    slider.addEventListener("mousemove", e => {
      if (!isDragging) return;
      const diff = e.clientX - start;
      current = prev + diff;
      slider.style.transform = `translateX(${current}px)`;
    });

    slider.addEventListener("mouseup", e => endDrag(e.clientX));
    slider.addEventListener("mouseleave", e => { if (isDragging) endDrag(e.clientX); });

    // Touch
    slider.addEventListener("touchstart", e => {
      isDragging = true;
      start = e.touches[0].clientX;
      prev = -index * slider.clientWidth;
      slider.style.transition = "none";
    });

    slider.addEventListener("touchmove", e => {
      if (!isDragging) return;
      const diff = e.touches[0].clientX - start;
      current = prev + diff;
      slider.style.transform = `translateX(${current}px)`;
    });

    slider.addEventListener("touchend", e => endDrag(e.changedTouches[0].clientX));

    function endDrag(endX) {
      isDragging = false;
      const moved = endX - start;

      if (moved < -50) next();
      else if (moved > 50) prev();
      else show(index);
    }
  </script>

</body>
</html>
