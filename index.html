<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iHAVEPHAI - ศูนย์รวมไผ่ครบวงจร</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* Animation สำหรับตะกร้าเมื่อมีการเปลี่ยนแปลง */
        @keyframes bounce-short {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .cart-bounce {
            animation: bounce-short 0.3s ease-in-out;
        }
    </style>
</head>

<body class="font-[Prompt] bg-gray-50 flex flex-col min-h-screen">

    <header class="sticky top-0 bg-white shadow-md z-50">
        <div class="max-w-7xl mx-auto flex items-center justify-between px-4 md:px-6 py-3">

            <div class="flex items-center gap-4">
                <button id="menu-btn" class="block md:hidden text-gray-700 focus:outline-none">
                    <i class="fa-solid fa-bars text-2xl"></i>
                </button>
                <a href="#" class="flex items-center space-x-2">
                    <img src="ihavephai.png" class="w-20 md:w-12">
                    <span class="font-bold text-green-600 text-xl hidden sm:block"></span>
                </a>
            </div>

            <nav class="hidden md:flex gap-8 text-gray-700 font-medium">
                <a href="#" class="hover:text-green-600 transition">หน้าแรก</a>
                <a href="#" class="hover:text-green-600 transition">สินค้าทั้งหมด</a>
                <a href="#" class="hover:text-green-600 transition">งานไม้ไผ่</a>
                <a href="#" class="hover:text-green-600 transition">บทความ</a>
            </nav>

            <div class="flex items-center space-x-4">
                <button onclick="alert('ระบบสมาชิกจะเปิดให้บริการเร็วๆ นี้')" class="text-gray-600 hover:text-green-600 transition">
                    <i class="fa-regular fa-user text-xl"></i>
                </button>
                
                <button onclick="toggleCart()" class="relative text-gray-600 hover:text-green-600 transition">
                    <i class="fa-solid fa-cart-shopping text-xl"></i>
                    <span id="cart-badge" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center opacity-0 transition-opacity duration-200">0</span>
                </button>
            </div>
        </div>
    </header>

    <section class="sticky top-[64px] z-40 bg-gray-100 py-3 shadow-sm">
        <div class="max-w-2xl mx-auto px-4">
            <form class="flex items-center bg-white rounded-full px-4 py-2 w-full shadow border border-gray-200 focus-within:border-green-500 transition">
                <i class="fa-solid fa-magnifying-glass text-gray-400 mr-2"></i>
                <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="ค้นหาพันธุ์ไผ่, เฟอร์นิเจอร์..." class="flex-1 bg-transparent outline-none text-gray-700" />
                <button type="button" class="text-green-600 font-semibold hover:text-green-800 text-sm">ค้นหา</button>
            </form>
        </div>
    </section>

    <section class="bg-gradient-to-r from-green-600 to-green-800 text-white py-12 md:py-20 text-center px-4">
        <h1 class="text-3xl md:text-5xl font-bold mb-4">คลังไผ่ออนไลน์ อันดับ 1</h1>
        <p class="text-green-100 text-lg mb-6">พันธุ์ไผ่คุณภาพ เฟอร์นิเจอร์งานฝีมือ และผลิตภัณฑ์แปรรูป ส่งตรงถึงบ้าน</p>
        <button onclick="document.getElementById('product-section').scrollIntoView({behavior: 'smooth'})" class="bg-white text-green-700 px-6 py-2 rounded-full font-bold hover:bg-green-50 shadow-lg transition transform hover:scale-105">
            ช้อปเลย
        </button>
    </section>

    <main id="product-section" class="max-w-7xl mx-auto px-4 py-10 flex-grow w-full">
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-2xl font-bold text-gray-800 border-l-4 border-green-500 pl-3">สินค้าแนะนำ</h2>
        </div>

        <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
            </div>
    </main>

    <footer class="bg-gray-800 text-gray-300 py-8 text-center mt-auto">
        <p>&copy; 2024 iHAVEPHAI. สงวนลิขสิทธิ์.</p>
    </footer>

    <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 transition-opacity duration-300" onclick="closeMenu()"></div>
    <aside id="drawer-menu" class="fixed top-0 left-0 h-full w-72 bg-white shadow-2xl transform -translate-x-full transition-transform duration-300 z-[60]">
        <div class="flex justify-between items-center p-5 border-b bg-green-50">
            <h2 class="text-lg font-bold text-green-700">เมนูหลัก</h2>
            <button onclick="closeMenu()" class="text-gray-500 hover:text-red-500 text-2xl">&times;</button>
        </div>
        <nav class="flex flex-col p-2">
            <a href="#" class="py-3 px-4 hover:bg-green-50 rounded-lg text-gray-700 font-medium">หน้าแรก</a>
            <a href="#" class="py-3 px-4 hover:bg-green-50 rounded-lg text-gray-700 font-medium">โปรโมชั่น</a>
            <a href="#" class="py-3 px-4 hover:bg-green-50 rounded-lg text-gray-700 font-medium">สินค้าทั้งหมด</a>
            <a href="#" class="py-3 px-4 hover:bg-green-50 rounded-lg text-gray-700 font-medium">ติดต่อเรา</a>
        </nav>
    </aside>

    <div id="cart-modal" class="fixed inset-0 z-[70] hidden">
        <div class="absolute inset-0 bg-black bg-opacity-60 transition-opacity" onclick="toggleCart()"></div>
        
        <div class="absolute right-0 top-0 h-full w-full max-w-md bg-white shadow-xl transform transition-transform duration-300 translate-x-full flex flex-col" id="cart-panel">
            
            <div class="p-5 border-b flex justify-between items-center bg-gray-50">
                <h2 class="text-xl font-bold text-gray-800"><i class="fa-solid fa-basket-shopping text-green-600 mr-2"></i> ตะกร้าของฉัน</h2>
                <button onclick="toggleCart()" class="text-gray-500 hover:text-red-500 transition"><i class="fa-solid fa-xmark text-2xl"></i></button>
            </div>

            <div id="cart-items" class="flex-1 overflow-y-auto p-5 space-y-4">
                <div class="text-center text-gray-400 mt-10">
                    <i class="fa-solid fa-basket-shopping text-6xl mb-4 opacity-30"></i>
                    <p>ยังไม่มีสินค้าในตะกร้า</p>
                </div>
            </div>

            <div class="p-5 border-t bg-gray-50">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-gray-600 font-medium">ยอดรวมทั้งหมด</span>
                    <span class="text-2xl font-bold text-green-600">฿<span id="cart-total">0</span></span>
                </div>
                <button onclick="checkout()" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700 shadow-md transition hover:-translate-y-1">
                    สั่งซื้อสินค้า
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. ข้อมูลสินค้าจำลอง ---
        const products = [
            { id: 1, name: "ไผ่กิมซุง (กิ่งพันธุ์)", price: 35, category: "พันธุ์ไผ่", image: "https://images.unsplash.com/photo-1533907650686-70576141c030?auto=format&fit=crop&w=500&q=80" },
            { id: 2, name: "เก้าอี้ไม้ไผ่สาน", price: 1290, category: "เฟอร์นิเจอร์", image: "https://images.unsplash.com/photo-1594273577741-6e3e55132d73?auto=format&fit=crop&w=500&q=80" },
            { id: 3, name: "หลอดดูดน้ำไม้ไผ่ (แพ็ค 10)", price: 150, category: "ของใช้", image: "https://images.unsplash.com/photo-1605342415177-3d964344183d?auto=format&fit=crop&w=500&q=80" },
            { id: 4, name: "โคมไฟไม้ไผ่สาน", price: 590, category: "ตกแต่ง", image: "https://plus.unsplash.com/premium_photo-1664303387790-25e98547e231?auto=format&fit=crop&w=500&q=80" },
            { id: 5, name: "หน่อไม้หวานอัดถุง", price: 80, category: "อาหาร", image: "https://images.unsplash.com/photo-1615485925763-8678628890a6?auto=format&fit=crop&w=500&q=80" },
            { id: 6, name: "รั้วไม้ไผ่สำเร็จรูป (1.5ม.)", price: 450, category: "ตกแต่งสวน", image: "https://images.unsplash.com/photo-1567332367554-18c7d812b322?auto=format&fit=crop&w=500&q=80" },
            { id: 7, name: "ตะกร้าสานไม้ไผ่", price: 250, category: "ของใช้", image: "https://images.unsplash.com/photo-1616606015525-4c0628290740?auto=format&fit=crop&w=500&q=80" },
            { id: 8, name: "ถ่านดูดกลิ่นไม้ไผ่", price: 45, category: "ของใช้", image: "https://images.unsplash.com/photo-1599908630737-1833878c772e?auto=format&fit=crop&w=500&q=80" }
        ];

        // --- 2. ฟังก์ชันแสดงสินค้า (อัปเดตสำหรับ Link ไปหน้ารายละเอียด) ---
        function renderProducts(items = products) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = items.map(product => `
                <div class="bg-white rounded-xl shadow-sm hover:shadow-xl transition duration-300 border border-gray-100 overflow-hidden group">
                    <a href="product_detail.html?id=${product.id}" class="block h-48 overflow-hidden relative cursor-pointer">
                        <img src="${product.image}" alt="${product.name}" class="w-full h-full object-cover group-hover:scale-110 transition duration-500">
                        <span class="absolute top-2 left-2 bg-green-100 text-green-800 text-xs font-semibold px-2 py-1 rounded-md">
                            ${product.category}
                        </span>
                    </a>
                    <div class="p-4">
                        <a href="product_detail.html?id=${product.id}" class="hover:text-green-600">
                            <h3 class="font-bold text-gray-800 text-lg truncate">${product.name}</h3>
                        </a>
                        <div class="flex justify-between items-end mt-3">
                            <span class="text-red-500 font-bold text-xl">฿${product.price}</span>
                            <button onclick="addToCart(${product.id})" class="bg-green-100 text-green-700 hover:bg-green-600 hover:text-white p-2 rounded-lg transition">
                                <i class="fa-solid fa-cart-plus"></i> เพิ่ม
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // --- 3. ฟังก์ชันตะกร้าสินค้า (อัปเดตสำหรับ LocalStorage) ---
        // โหลดตะกร้าจาก LocalStorage หากมี หรือเริ่มจากตะกร้าว่าง
        let cart = JSON.parse(localStorage.getItem('iHavePhaiCart')) || [];

        function saveCartToStorage() {
            localStorage.setItem('iHavePhaiCart', JSON.stringify(cart));
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const existingItem = cart.find(item => item.id === id);

            if (existingItem) {
                existingItem.qty++;
            } else {
                cart.push({ ...product, qty: 1 });
            }

            saveCartToStorage(); // บันทึกหลังเพิ่มสินค้า
            updateCartUI();
            
            // Animation เล็กน้อยที่ปุ่มตะกร้า
            const btn = document.querySelector('.fa-cart-shopping').parentElement;
            btn.classList.add('cart-bounce');
            setTimeout(() => btn.classList.remove('cart-bounce'), 300);
        }

        function updateCartUI() {
            // อัปเดตตัวเลข Badge
            const badge = document.getElementById('cart-badge');
            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            badge.innerText = totalQty;
            badge.classList.toggle('opacity-0', totalQty === 0);

            // อัปเดตรายการใน Modal
            const cartItemsContainer = document.getElementById('cart-items');
            const totalPriceEl = document.getElementById('cart-total');
            
            let total = 0;

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = `
                    <div class="text-center text-gray-400 mt-10">
                        <i class="fa-solid fa-basket-shopping text-6xl mb-4 opacity-30"></i>
                        <p>ยังไม่มีสินค้าในตะกร้า</p>
                        <button onclick="toggleCart()" class="text-green-600 text-sm mt-2 hover:underline">ไปเลือกซื้อสินค้า</button>
                    </div>`;
            } else {
                cartItemsContainer.innerHTML = cart.map(item => {
                    total += item.price * item.qty;
                    return `
                    <div class="flex items-center gap-3 bg-white p-2 rounded-lg border border-gray-100 shadow-sm">
                        <img src="${item.image}" class="w-16 h-16 object-cover rounded-md">
                        <div class="flex-1">
                            <h4 class="font-semibold text-gray-700 text-sm">${item.name}</h4>
                            <p class="text-red-500 font-bold">฿${item.price}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="updateQty(${item.id}, -1)" class="w-6 h-6 bg-gray-200 rounded text-gray-600 hover:bg-gray-300">-</button>
                            <span class="text-sm font-medium w-4 text-center">${item.qty}</span>
                            <button onclick="updateQty(${item.id}, 1)" class="w-6 h-6 bg-green-100 text-green-700 rounded hover:bg-green-200">+</button>
                        </div>
                        <button onclick="removeFromCart(${item.id})" class="text-gray-400 hover:text-red-500 ml-2">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                    `;
                }).join('');
            }

            totalPriceEl.innerText = total.toLocaleString();
        }

        function updateQty(id, change) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.qty += change;
                if (item.qty <= 0) removeFromCart(id);
                else {
                    saveCartToStorage(); // เพิ่ม: บันทึกหลังอัปเดต
                    updateCartUI();
                }
            }
        }

        function removeFromCart(id) {
            cart = cart.filter(i => i.id !== id);
            saveCartToStorage(); // เพิ่ม: บันทึกหลังลบ
            updateCartUI();
        }

        // --- 4. Logic การเปิด-ปิด UI ---
        
        // Menu Drawer (Mobile)
        const menuBtn = document.getElementById('menu-btn');
        const drawer = document.getElementById('drawer-menu');
        const overlay = document.getElementById('overlay');

        function openMenu() {
            drawer.classList.remove('-translate-x-full');
            overlay.classList.remove('hidden');
        }
        function closeMenu() {
            drawer.classList.add('-translate-x-full');
            overlay.classList.add('hidden');
        }
        menuBtn.addEventListener('click', openMenu);

        // Cart Drawer
        function toggleCart() {
            const modal = document.getElementById('cart-modal');
            const panel = document.getElementById('cart-panel');
            
            if (modal.classList.contains('hidden')) {
                // Open
                modal.classList.remove('hidden');
                setTimeout(() => {
                    panel.classList.remove('translate-x-full');
                }, 10); // delay เล็กน้อยให้ transition ทำงาน
            } else {
                // Close
                panel.classList.add('translate-x-full');
                setTimeout(() => {
                    modal.classList.add('hidden');
                }, 300); // รอ animation จบ
            }
        }

        // Search Filter
        function filterProducts() {
            const text = document.getElementById('searchInput').value.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(text));
            renderProducts(filtered);
        }

        // Checkout Function (Mockup)
        function checkout() {
            if (cart.length === 0) {
                alert("ตะกร้ายังว่างอยู่เลยครับ!");
                return;
            }
            const total = document.getElementById('cart-total').innerText;
            if(confirm(`ยืนยันการสั่งซื้อรวมยอด ${total} บาท หรือไม่?`)) {
                alert("✅ สั่งซื้อสำเร็จ! \n(นี่เป็นระบบจำลอง ขอบคุณที่ทดสอบครับ)");
                cart = [];
                saveCartToStorage(); // เพิ่ม: บันทึกหลังชำระเงิน
                updateCartUI();
                toggleCart();   
            }
        }

        // Start
        window.onload = () => {
            renderProducts();
            updateCartUI(); // โหลด UI จากตะกร้าที่ค้างอยู่
            
            // ตรวจสอบ URL หากมี parameter 'openCart=true' ให้เปิดตะกร้า (สำหรับปุ่มซื้อเลยจากหน้ารายละเอียด)
            const urlParams = new URLSearchParams(window.location.search);
            if(urlParams.get('openCart') === 'true') {
                toggleCart();
            }
        };

    </script>
</body>
</html>
